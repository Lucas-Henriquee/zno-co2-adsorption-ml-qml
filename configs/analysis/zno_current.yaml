schema_version: 1

project:
  name: zno-analysis
  description: Science tables, paper figures and tables, and model analysis of one simulation run (and one model run).

input:
  # Simulation run (results/simulations/<run-id>) and model run (results/models/<run-id>).
  # Override with --scientific-results and --model-run.
  scientific_results: results/simulations/zno_ic_final
  # No valid model run exists yet (the ML phase reruns on the zno_ic_final datasets);
  # pass --model-run for the models stage. science and paper do not read it.
  model_run: results/models/zno_md_grouped_local
  material: ZnO

output:
  root: results/analyses

execution:
  environment: qml-zno-modeling

methods:
  # Ranks successful DFT rows by adsorption energy (input of the ML datasets); PBE gaps and
  # isolated-CO2 TDDFT values are reported for information only (no photocatalysis score).
  screening: {}

  # CHE free energies in variants a-c; every CO2RR value (co2_reduction, fig05, table02) uses this variant.
  co2rr_corrections:
    variant: c

  co2_reduction:
    require_pathway_results: true

  neb:
    # null: methods.neb.barrier_resolution_ev of the run's config.yaml (0.03 eV).
    barrier_resolution_ev: null
    smooth_band: true
    dpi: 600

  md_trajectory:
    desorption_threshold_ang: 4.5

  structures:
    # null: data/geometries/<material> of the run, else of the repository.
    geometry_dir: null
    # true: keep going despite geometry warnings; fig01 is then noted as a diagnostic draft.
    allow_geometry_warnings: false
    # fig01 renderer of export_pymol: auto (PyMOL when importable, else ASE/matplotlib), pymol, ase, none.
    render: auto
    dpi: 600

  paper_figures:
    dpi: 600
    tddft_sigma_ev: 0.10
    # MD seed drawn in fig06 (a site without it uses its first available seed).
    md_seed: 1234
    # null: fig03-fig07; or a non-empty subset, e.g. [fig04]. An empty list is an error.
    figures: null

  paper_tables: {}

  model_analysis:
    dpi: 300
