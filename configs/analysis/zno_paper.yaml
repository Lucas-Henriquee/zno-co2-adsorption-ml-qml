schema_version: 1

project:
  name: zno-paper-analysis
  description: Paper figures and tables (fig01, fig03-fig07, table02) of one simulation run.

input:
  # Simulation run directory (results/simulations/<run-id>); override with
  # --scientific-results. The paper alias does not read a model run.
  scientific_results: results/simulations/zno_ic_final
  model_run: results/models/zno_md_grouped_local
  material: ZnO

output:
  root: results/analyses

execution:
  environment: qml-zno-modeling

methods:
  screening: {}

  # CHE free energies in variants a-c; every CO2RR value of the paper uses this variant.
  co2rr_corrections:
    variant: c

  co2_reduction:
    require_pathway_results: true

  science_figures:
    dpi: 600

  neb:
    # null: methods.neb.barrier_resolution_ev of the run's config.yaml (0.03 eV).
    barrier_resolution_ev: null
    smooth_band: true
    dpi: 600

  md_trajectory:
    # Also passed to paper_figures (--desorption-threshold; not drawn).
    desorption_threshold_ang: 4.5

  structures:
    # null: data/geometries/<material> of the run, else of the repository.
    geometry_dir: null
    # true: render the preview despite geometry warnings; fig01 is then noted as a diagnostic draft.
    allow_geometry_warnings: false
    # fig01 renderer of export_pymol: auto (PyMOL when `import pymol` works, else the
    # ASE/matplotlib fallback), pymol, ase, or none (PDB/CIF + .pml only, no PNG).
    render: auto
    # dpi of the fig01 PNGs and of the matplotlib preview.
    dpi: 600

  paper_figures:
    dpi: 600
    tddft_sigma_ev: 0.10
    # MD seed drawn in fig06 (a site without it uses its first available seed).
    md_seed: 1234
    # null: fig03-fig07; or a subset, e.g. [fig04].
    figures: null

  paper_tables: {}

  model_analysis:
    dpi: 300
