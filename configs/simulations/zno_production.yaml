schema_version: 1

project:
  name: zno-co2-production
  description: Production parameters for ZnO and CO2 simulations.

selection:
  materials:
    - ZnO
  sites:
    - top_metal
    - top_oxygen
    - bridge

output:
  root: results/simulations

execution:
  environment: qml-zno-simulation
  omp_num_threads: 1
  mpi:
    enabled: true
    processes: 10
    launcher: mpiexec
    extra_args:
      - --mca
      - btl
      - self,vader
    methods:
      - dft
      - tddft
      - co2rr
      - md
      - neb

methods:
  geometry: {}

  dft:
    fmax_ev_per_angstrom: 0.05
    max_steps: 180
    ecut_ev: 500.0
    kpoints: [2, 3, 1]
    co2_box_vacuum_angstrom: 8.0

  tddft:
    max_transitions: 50
    oscillator_strength_threshold: 0.001

  co2rr:
    fmax_ev_per_angstrom: 0.05
    max_steps: 260
    ecut_ev: 500.0
    kpoints: [2, 3, 1]
    molecule_box_vacuum_angstrom: 8.0

  md:
    temperature_kelvin: 300.0
    steps: 2000
    timestep_fs: 1.0
    log_interval: 20
    ecut_ev: 500.0
    kpoints: [2, 3, 1]

  neb:
    internal_images: 3
    # Plain-NEB phase; the climbing-image phase always follows with fmax_ci.
    fmax_ev_per_angstrom: 0.08
    fmax_ci_ev_per_angstrom: 0.05
    # Total step budget; climb_start_fraction of it goes to the plain phase.
    max_steps: 300
    ecut_ev: 500.0
    kpoints: [2, 3, 1]
    interpolation: idpp
    optimizer: FIRE
    climb: true
    climb_start_fraction: 0.30
    parallel_images: true
    # Elementary hops only: on the 2x1 cell top_metal, bridge and top_oxygen are
    # collinear along y, so top_metal -> top_oxygen would pass over bridge.
    pairs:
      - [top_metal, bridge]
      - [bridge, top_oxygen]
