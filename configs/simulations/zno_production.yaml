schema_version: 1

project:
  name: zno-co2-production
  description: Production parameters for ZnO and CO2 simulations.

selection:
  materials:
    - ZnO
  sites:
    - top_metal
    - top_oxygen
    - bridge

output:
  root: results/simulations

execution:
  environment: qml-zno-simulation
  omp_num_threads: 1
  mpi:
    enabled: true
    # 6 ranks: the 2x1 cell with k 2x3x1 and symmetry off has 6 k-points (one per rank),
    # and the lab PC has 6 performance cores.
    processes: 6
    launcher: mpiexec
    extra_args:
      - --mca
      - btl
      - self,vader
    methods:
      - dft
      - tddft
      - co2rr
      - md
      - neb

methods:
  geometry: {}

  dft:
    fmax_ev_per_angstrom: 0.05
    max_steps: 180
    ecut_ev: 500.0
    kpoints: [2, 3, 1]
    co2_box_vacuum_angstrom: 8.0
    # Extra blocks of max_steps BFGS steps, continued from the last geometry, before a
    # relaxation that hit the step limit is declared failed.
    relax_extra_blocks: 1
    # Optional SCF force criterion in eV/Ang (e.g. 0.01); null keeps GPAW's defaults.
    scf_force_convergence: null

  # LrTDDFT spectrum of the CO2 molecule in its adsorbed (DFT-optimised)
  # geometry, isolated in a non-periodic box WITHOUT the slab (fd mode, Gamma).
  # It is not the optical response of ZnO-CO2; do not compare it with a
  # photocatalyst onset target. All energies are written in eV.
  tddft:
    # Lowest transitions kept after diagonalisation (TRK uses all of them).
    max_transitions: 50
    # Onset = lowest transition with oscillator strength f >= threshold.
    oscillator_strength_threshold: 0.001
    grid_spacing_angstrom: 0.25
    box_size_angstrom: 18.0
    smearing_width_ev: 0.10
    # CO2: 8 occupied bands + 60 unoccupied.
    nbands: 68
    converged_bands: 68
    # Maximal Kohn-Sham transition energy in the LrTDDFT basis.
    energy_window_ev: 30.0

  co2rr:
    fmax_ev_per_angstrom: 0.05
    max_steps: 260
    ecut_ev: 500.0
    kpoints: [2, 3, 1]
    molecule_box_vacuum_angstrom: 8.0
    # Thermochemistry (read by run_co2rr_pathways.py from this file; CLI flags override).
    # vibrations: false gives electronic energies only and dE_* columns, never dG_*.
    vibrations: true
    vibration_displacement_angstrom: 0.01
    temperature_kelvin: 298.15
    electrode_potential_v_rhe: 0.0
    # H2O at 0.035 bar is in equilibrium with liquid water at 298 K (Peterson et al. 2010).
    partial_pressures_bar:
      CO2: 1.0
      CO: 1.0
      H2: 1.0
      H2O: 0.035
    # Additive corrections (eV) to G of gas-phase CO2 and CO for the PBE error.
    # Kept at zero: literature values are functional- and setup-specific and must be
    # verified for PBE/GPAW before use.
    gas_corrections_ev:
      CO2: 0.0
      CO: 0.0
    # O* is not part of the CO2 -> CO pathway; when true it is computed and reported
    # only as the separate quantity "O* formation from H2O".
    o_star_reference: false

  md:
    # The MD uses the GPAW profile (smearing, mixer, maxiter) of the DFT run for each
    # site (dft_summary.csv: dft_profile); ecut_ev and kpoints must equal methods.dft.
    temperature_kelvin: 300.0
    # Deprecated alias of production_steps, kept for the workflow command line.
    steps: 2000
    equilibration_steps: 1000  # 1 ps at 1 fs; written separately, not used for descriptors
    production_steps: 2000
    timestep_fs: 1.0
    friction_per_fs: 0.01  # Langevin friction in fs^-1 (tau = 100 fs)
    log_interval: 20
    seed: 1234
    seeds: []  # several seeds -> one independent trajectory each (md/<material>/<site>/seed_<n>)
    nve_test_steps: 200  # only with run_md.py --nve-test
    nve_test_timesteps_fs: [0.5, 1.0]
    ecut_ev: 500.0
    kpoints: [2, 3, 1]

  neb:
    internal_images: 3
    # Plain-NEB phase; the climbing-image phase always follows with fmax_ci.
    fmax_ev_per_angstrom: 0.08
    fmax_ci_ev_per_angstrom: 0.05
    # Total step budget; climb_start_fraction of it goes to the plain phase.
    max_steps: 300
    ecut_ev: 500.0
    kpoints: [2, 3, 1]
    interpolation: idpp
    optimizer: FIRE
    climb: true
    climb_start_fraction: 0.30
    parallel_images: true
    # Endpoint single points must reproduce the DFT run within these tolerances.
    endpoint_energy_tol_ev: 0.02
    endpoint_force_factor: 1.5
    # Elementary hops only: on the 2x1 cell top_metal, bridge and top_oxygen are
    # collinear along y, so top_metal -> top_oxygen would pass over bridge.
    pairs:
      - [top_metal, bridge]
      - [bridge, top_oxygen]
