schema_version: 1

project:
  name: zno-md-window-ibm-plan
  description: Small matched local and IBM QSVM plan with no automatic submission.

input:
  # Grouped MD-window dataset of a dataset run: data/generated/<dataset-run-id>/...
  # Override with --dataset. Every row must carry 'group' (material/site/seed);
  # train/test and CV keep each trajectory on one side. The legacy
  # zno_existing_v1 dataset has no group column and is rejected.
  dataset: data/generated/zno_production_datasets/multitech/md_window_unique_dataset.csv
  label: label_site_id
  # Independent-trajectory column. Documentation only: run_benchmarks.py uses
  # --group-column, whose default is "group".
  group_column: group

output:
  root: results/models

execution:
  environment: qml-zno-modeling
  timeout_seconds: 300
  fail_fast: true

split:
  # Grouped holdout: round(test_size x trajectories) of each site go to test, at
  # least one. Needs >= 2 trajectories (seeds) per site, >= 3 if CV is enabled;
  # otherwise the run stops with an explanation instead of splitting windows.
  seeds: [42]
  test_size: 0.25
  # 0 = every window for the local SVM/QSVM runs; the hardware subsample is
  # ibm.max_samples.
  max_samples: 0

common:
  feature_sets: [md3]
  c_parameter: 1.0
  class_weight: balanced

svm:
  kernels: [rbf]
  # Same preprocessing as the QSVM (power transform, MinMax to [0, pi]) so the
  # models differ only in the kernel.
  scalers: [power_minmax]
  gamma: scale
  degree: 3
  # Grouped CV folds (StratifiedGroupKFold) on the training trajectories,
  # identical for SVM and QSVM; reduced to the training trajectories per site,
  # 0 disables. Holdout scripts report CV but keep C/gamma fixed; tuning is
  # done by the grouped protocol (evaluation.tuning: nested).
  cv_folds: 5

qsvm:
  scalers: [power_minmax]
  entanglements: [linear]
  reps: [1]
  qubits: [0]
  cv_folds: 5
  simulators: [reference]
  mps_max_bond_dimension: 0
  mps_truncation_threshold: 0.0

ibm:
  feature_sets: [md3]
  # Explicit small subsample for hardware only (spread over as many trajectories
  # as possible). A matched local QSVM is run on the same rows. Hardware results
  # are a feasibility demonstration, not a statistical accuracy estimate.
  max_samples: 12
  # ideal (unchanged): training diagonal K(x,x) fixed to 1, while test entries
  # are noisy hardware estimates (K(x,x) < 1 on hardware). measured: measure the
  # training diagonal; measured_normalized: measure train and test diagonals and
  # normalise both kernels by sqrt(K(x,x) K(y,y)). Both add circuits.
  kernel_diagonal: ideal
  qubits: [3]
  shots: [512]
  # Set a backend explicitly before any repeated or real hardware study.
  backend: null
  account: null
  instance: null
  optimization_level: 2
  transpiler_seed: 42
  max_circuits_per_job: 100
  trials: 1
  force_ipv4: false

evaluation:
  # The ibm and ibm-plan methods always use the hardware holdout; the grouped
  # protocol (grouped_27) applies to the svm, qsvm and local methods only.
  protocol: holdout
