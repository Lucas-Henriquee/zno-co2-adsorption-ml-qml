schema_version: 1

project:
  name: zno-simulation-run-datasets
  description: >
    Datasets with one row per independent sample (DFT calculation, MD block or MD
    trajectory) from one isolated simulation run.

input:
  # Simulation run directory: results/simulations/<run-id>. Replace the run ID
  # here or pass --source-results results/simulations/<run-id>. The legacy
  # results/ tree was produced with a wrong geometry and must not be used.
  results_dir: results/simulations/zno_production
  # Relative input paths are resolved below results_dir.
  tddft_summary: tddft_summary.csv
  tddft_directory: tddft
  # Written by analyze_results.py when run with QML_ZNO_RESULTS_DIR set to the run;
  # a workflow analysis run is passed with --ranking instead.
  ranking: analysis/ranked_candidates.csv

output:
  # Every execution receives a new directory below this path.
  root: data/generated

execution:
  environment: qml-zno-modeling

methods:
  tddft:
    mode: both

  multitech:
    # summary: one row per successful DFT calculation (carbonate excluded).
    # md_windows: md_window_unique_dataset.csv (blocks) + md_trajectory_dataset.csv.
    # The former 'expanded' target (cartesian product) was removed.
    targets:
      - summary
      - md_windows
    # Maximum number of blocks per MD trajectory (seed); 0 = no cap.
    md_windows_per_site: 10
    # ONE common block length for every trajectory, chosen before labels are used:
    # block_tau_factor x the largest statistical inefficiency g = 1 + 2 sum rho_k
    # (Sokal tau_int = g/2) over all trajectories and descriptors, unless
    # block_length_fs fixes it; then raised to min_block_length_fs. The chosen
    # value is written to md_window_unique_dataset_metadata.json.
    block_tau_factor: 2.0
    block_length_fs: null
    min_block_length_fs: 0.0
    # Used only for MD tables without a 'phase' column.
    equilibration_fs: 0.0

  qml_features:
    # Used only when the ranking table has no material column.
    default_material: ZnO
    # Ranked-table columns exported; rows with a missing value are dropped (no
    # zero imputation). The target is the site label, not a score.
    features:
      - adsorption_energy_ev
      - adsorbed_band_gap_gamma_ev
